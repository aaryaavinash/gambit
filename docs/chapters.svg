<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from Gambit</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#080706"/><path d="M40 40H1160M40 347H1160" stroke="#a8453a" stroke-opacity=".8"/><path d="M320 40V347" stroke="#a8453a" stroke-opacity=".55"/><text x="55" y="67" fill="#a8453a" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#b89b6a" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#a8453a" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#b89b6a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#b89b6a"/> --><text x="180" y="191" text-anchor="middle" fill="#b89b6a" font-family="Georgia,serif" font-size="54" font-style="italic">I</text><text x="55" y="281" fill="#ece5d8" font-family="Georgia,serif" font-style="italic" font-size="22">The Immortal Game</text><text x="55" y="307" fill="#a8453a" font-family="Arial,sans-serif" font-size="11">A historic game becomes a</text><text x="55" y="325" fill="#a8453a" font-family="Arial,sans-serif" font-size="11">guided scene.</text><path d="M600 40V347" stroke="#a8453a" stroke-opacity=".55"/><text x="335" y="67" fill="#a8453a" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#b89b6a" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#a8453a" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#b89b6a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#b89b6a"/> --><text x="460" y="191" text-anchor="middle" fill="#b89b6a" font-family="Georgia,serif" font-size="54" font-style="italic">C</text><text x="335" y="281" fill="#ece5d8" font-family="Georgia,serif" font-style="italic" font-size="22">Carrara</text><text x="335" y="307" fill="#a8453a" font-family="Arial,sans-serif" font-size="11">Pale stone catches the light.</text><path d="M880 40V347" stroke="#a8453a" stroke-opacity=".55"/><text x="615" y="67" fill="#a8453a" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 03</text><circle cx="740" cy="173" r="68" fill="none" stroke="#b89b6a" stroke-opacity=".7" stroke-width="2"/><circle cx="740" cy="173" r="46" fill="none" stroke="#a8453a" stroke-opacity=".65"/><path d="M740 106V240M673 173H807" stroke="#b89b6a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="740" cy="173" r="17" fill="#b89b6a"/> --><text x="740" y="191" text-anchor="middle" fill="#b89b6a" font-family="Georgia,serif" font-size="54" font-style="italic">N</text><text x="615" y="281" fill="#ece5d8" font-family="Georgia,serif" font-style="italic" font-size="22">Nero Marquina</text><text x="615" y="307" fill="#a8453a" font-family="Arial,sans-serif" font-size="11">Dark marble holds the other</text><text x="615" y="325" fill="#a8453a" font-family="Arial,sans-serif" font-size="11">side.</text><path d="M1160 40V347" stroke="#a8453a" stroke-opacity=".55"/><text x="895" y="67" fill="#a8453a" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 04</text><circle cx="1020" cy="173" r="68" fill="none" stroke="#b89b6a" stroke-opacity=".7" stroke-width="2"/><circle cx="1020" cy="173" r="46" fill="none" stroke="#a8453a" stroke-opacity=".65"/><path d="M1020 106V240M953 173H1087" stroke="#b89b6a" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="1020" cy="173" r="17" fill="#b89b6a"/> --><text x="1020" y="191" text-anchor="middle" fill="#b89b6a" font-family="Georgia,serif" font-size="54" font-style="italic">S</text><text x="895" y="281" fill="#ece5d8" font-family="Georgia,serif" font-style="italic" font-size="22">The salon</text><text x="895" y="307" fill="#a8453a" font-family="Arial,sans-serif" font-size="11">A place to keep the game</text><text x="895" y="325" fill="#a8453a" font-family="Arial,sans-serif" font-size="11">going.</text></svg>