<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Gambit visual palette</title><desc id="desc">The site's background, ink, accent, and secondary colors with its display typography.</desc><rect width="1200" height="300" fill="#080706"/><path d="M40 36H1160M40 272H1160" stroke="#a8453a" stroke-opacity=".7"/><text x="54" y="69" fill="#a8453a" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">VISUAL LANGUAGE / CHESS</text><text x="54" y="166" fill="#b89b6a" font-family="Georgia,serif" font-style="italic" font-size="62">Gambit</text><text x="54" y="220" fill="#ece5d8" font-family="Arial,sans-serif" font-size="20">Marble chess and a members’ salon</text><text x="54" y="254" fill="#a8453a" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2">BODONI MODA · INTER</text><g transform="translate(800 93)"><rect width="76" height="76" fill="#080706" stroke="#a8453a"/><rect x="90" width="76" height="76" fill="#ece5d8"/><rect x="180" width="76" height="76" fill="#b89b6a"/><rect x="270" width="76" height="76" fill="#a8453a"/><g fill="#a8453a" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5"><text x="0" y="96">GROUND</text><text x="90" y="96">INK</text><text x="180" y="96">ACCENT</text><text x="270" y="96">SECOND</text></g></g></svg>